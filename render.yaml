# Render Blueprint for the KarNama API.
#
# Render reads this from the repository, so the service is created from the file
# rather than from twenty fields in a web form that nobody can review later.
#
# WHY THERE IS NO `databases:` BLOCK, which is the whole point of this comment:
# Render's free Postgres **expires 30 days after it is created** and the data is
# deleted after a 14 day grace period. A demo that dies a month after it ships is
# not deployed, it is scheduled for deletion. Supabase's free tier has the same
# shape of problem for a different reason — it PAUSES a project after 7 days of
# no traffic, which is exactly the traffic pattern a portfolio project has.
#
# So the database is **Neon**, whose free tier scales compute to zero but keeps
# the project reachable and does not expire. `DATABASE_URL` is set from Neon's
# pooled connection string and is marked `sync: false` so it is entered once in
# the dashboard and never committed here.

services:
  - type: web
    name: karnama-api
    runtime: node
    plan: free
    # Closest free region to the users this is built for.
    region: frankfurt

    # The repository is an npm workspace, so install at the root and build only
    # the API. `npm ci` honours the lockfile, which is the point of committing
    # one.
    #
    # `--include=dev` is NOT optional here, and leaving it out is exactly how
    # the first deploy failed. `NODE_ENV` is set to `production` below, and npm
    # SKIPS devDependencies when it sees that — so `typescript` and `@types/pg`
    # were never installed and `tsc` died on the first typed import:
    #
    #   src/database/cli.ts(2,16): error TS7016: Could not find a declaration
    #   file for module 'pg'
    #
    # The build needs the dev tools; the RUNTIME does not, and does not get
    # them, because `startCommand` runs compiled JavaScript.
    buildCommand: npm ci --include=dev && npm run build --workspace @karnama/api
    startCommand: npm run db:migrate --workspace @karnama/api && npm run start --workspace @karnama/api

    # Rebuild on every push to the default branch, so there is no manual step.
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      # The SAME fix as `--include=dev` in the build command, by a route that
      # does not depend on the build command at all.
      #
      # Editing `buildCommand` here does not retroactively change a service that
      # Render already created from an earlier version of this file: the service
      # keeps the settings it was made with until the Blueprint is re-synced. So
      # the first fix was correct and still produced an identical failure.
      #
      # An environment variable is read by EVERY npm invocation in the service,
      # including a stale build command, so this works whichever one runs.
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'

      # Required, with NO default on purpose: `env.ts` refuses to boot without
      # it, because a default here is a permissive CORS policy nobody chose.
      # This is the GitHub Pages origin the web app is served from.
      - key: WEB_ORIGIN
        value: https://sijav.github.io

      # Set once in the Render dashboard from Neon's POOLED connection string.
      # `sync: false` keeps it out of this file and out of git.
      - key: DATABASE_URL
        sync: false

      # Everything demo extraction depends on, KN-485. A variable that decides
      # whether the service works belongs where the service is defined, and
      # before this the API could start with none of these and report itself
      # healthy while every extraction failed. `env.ts` now refuses to start
      # when demo extraction is on and any of them is missing, so the failure
      # arrives as a failed deploy rather than as a reader's failed extraction.
      #
      # ALL of them are `sync: false`, including the ones that are not secret,
      # and that is deliberate. This file cannot see what the dashboard holds,
      # and a value written here is pushed over the live one at the next
      # Blueprint sync: guessing `groq` would repoint a service that had chosen
      # otherwise, and guessing a hop count would change whose address the API
      # believes. Declaring them says what a deploy needs without overwriting
      # what a deploy already has.
      #
      # A newly declared `sync: false` variable is not prompted for on a service
      # Render has already created, the same way an edited `buildCommand` is
      # not, for the reason recorded above: the service keeps what it was made
      # with until the Blueprint is re-synced. The secrets here were entered in
      # the dashboard by hand when demo extraction was turned on, so this
      # declares what is there rather than asking for anything new. A service
      # created FRESH from this file is prompted for all five.
      - key: AUTH_SECRET
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # Which provider reads a posting. It has no default in `env.ts` any more:
      # a default is applied while parsing, so a provider nobody chose cannot be
      # told from one that was, and that is what let a Groq deployment boot
      # pointing at OpenAI with no key for it.
      - key: EXTRACTION_PROVIDER
        sync: false

      # Whether someone signed out may extract, rate limited. The refusal above
      # fires only while this is true.
      - key: ALLOW_DEMO_EXTRACTION
        sync: false

      # How many proxies sit in front of this service, for working out who is
      # calling. Zero means the socket peer is the caller.
      - key: TRUST_PROXY_HOPS
        sync: false

      # OPENAI_API_KEY and OPENAI_EXTRACTION_MODEL are deliberately absent: this
      # deployment reads postings with Groq, and declaring a secret that nobody
      # sets is a prompt for nothing. `env.ts` demands them only when a
      # deployment actually chooses OpenAI, and the model as well as the key,
      # because unlike Groq's the OpenAI model is defaulted nowhere.

    # Free instances spin down after 15 minutes of inactivity and take about a
    # minute to wake. That is not a surprise to this product: DESIGN.md already
    # requires the UI to handle a cold start honestly rather than look broken.
