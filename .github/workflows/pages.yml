name: Pages

# Publishes two SEPARATE static sites from one repository:
#
#   /KarNama/           the web app
#   /KarNama/storybook/ the component library
#
# They are built independently, with their own base paths, and assembled into
# one artifact. GitHub Pages serves one site per repository, so "separated"
# here means separate builds at separate paths rather than one bundle that
# happens to contain both — Storybook is not routed through the app, and
# breaking one does not take the other down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and do NOT cancel one in flight: a cancelled
# deploy-pages can leave the site pointing at a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # One base for the Storybook build and the check that opens it, KN-226. The
    # app's build reads KARNAMA_BASE, not this.
    env:
      KARNAMA_STORYBOOK_BASE: /KarNama/storybook/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The app is served from /KarNama/, a dev server from /. Vite's `base`
      # has to match or every asset 404s in production while looking fine
      # locally.
      - name: Build the web app
        # The build stops before it starts when the API's address is missing, KN-489:
        # an empty VITE_API_URL builds a client that rejects every call as
        # API_NOT_CONFIGURED, and deploys went out that way on 2026-09-12, each
        # reporting success. White space counts as empty, since the client would
        # take it for an address and call it.
        run: |
          set -euo pipefail
          if [ -z "$(printf '%s' "${VITE_API_URL:-}" | tr -d '[:space:]')" ]; then
            echo "::error title=KARNAMA_API_URL is empty::The Pages build needs the repository variable KARNAMA_API_URL, the API's GraphQL address. Without it the app rejects every call as API_NOT_CONFIGURED."
            exit 1
          fi
          npm run build --workspace @karnama/web
        env:
          KARNAMA_BASE: /KarNama/
          VITE_API_URL: ${{ vars.KARNAMA_API_URL }}
          VITE_AUTH_MODE: demo

      - name: Build Storybook
        run: npm run build-storybook --workspace @karnama/web

      # Every story of that build opened in headless Chromium before anything is
      # published, KN-226: a page error, a console error or a thrown play, heard
      # until the story's play has ended and 400 milliseconds after, stops the
      # run here, the app's deploy with it, and Pages keeps serving the last good
      # site.
      - name: Install Chromium for the Storybook check
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Open every story of the Storybook build
        working-directory: apps/web
        run: npx playwright test --config playwright.storybook.config.ts

      - name: Keep the Storybook check's report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-check-report
          path: apps/web/playwright-report/storybook

      - name: Assemble the two sites
        run: |
          set -euo pipefail
          mkdir -p site/storybook
          # The app's build writes 404.html and a page for each destination,
          # KN-505: Pages serves a path from the .html file of that name with
          # 200, so /KarNama/network from network.html, and a path it has no
          # file for from 404.html with 404.
          cp -r apps/web/dist/. site/
          cp -r apps/web/storybook-static/. site/storybook/
          # Jekyll would otherwise drop every _-prefixed file, which is most of
          # what a bundler emits.
          touch site/.nojekyll

      - name: Fail if either site is missing
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/404.html
          test -f site/jobs.html
          test -f site/add.html
          test -f site/network.html
          test -f site/storybook/index.html
          echo "app, its pages and storybook all present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
